name: Deploy Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beget-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Beget
    runs-on: ubuntu-latest
    environment:
      name: beget-production
      url: https://rwscargo.ru

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ci

      - name: Prepare Beget API
        env:
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
          CRM_ADMIN_USER: ${{ secrets.CRM_ADMIN_USER }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
          LEAD_EMAIL_FROM: ${{ secrets.LEAD_EMAIL_FROM }}
          PUBLIC_SITE_URL: https://rwscargo.ru
        run: |
          node scripts/prepare-beget-api.mjs
          docker run --rm -v "$PWD:/app" -w /app php:8.2-cli php -l dist/api/index.php

      - name: Prepare SSH
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keyscan -p "$BEGET_PORT" "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
        run: |
          rsync -az --delete \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/beget_deploy_key -p $BEGET_PORT" \
            dist/ "$BEGET_USER@$BEGET_HOST:$BEGET_PATH/"

      - name: Prepare CRM storage
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
        run: |
          DATA_DIR="$(dirname "$BEGET_PATH")/rwscargo-crm-data"
          ssh -i ~/.ssh/beget_deploy_key -p "$BEGET_PORT" "$BEGET_USER@$BEGET_HOST" \
            "mkdir -p '$DATA_DIR' && chmod 775 '$DATA_DIR'"

      - name: Verify Beget API
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt"
            health_response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' https://rwscargo.ru/api/health || true)"
            echo "$health_response"

            if echo "$health_response" | grep -q 'HTTP_STATUS:200'; then
              exit 0
            fi

            echo "Direct PHP check"
            curl -sS -w '\nHTTP_STATUS:%{http_code}\n' https://rwscargo.ru/api/index.php || true
            sleep 5
          done

          exit 1
