name: Deploy Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beget-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Beget
    runs-on: ubuntu-latest
    environment:
      name: beget-production
      url: https://rwscargo.ru

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ci

      - name: Prepare Beget API
        env:
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_NODE_PATH: ${{ secrets.BEGET_NODE_PATH }}
          CRM_ADMIN_USER: ${{ secrets.CRM_ADMIN_USER }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_SITE_URL: https://rwscargo.ru
        run: node scripts/prepare-beget-api.mjs

      - name: Prepare SSH
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keyscan -p "$BEGET_PORT" "$BEGET_HOST" >> ~/.ssh/known_hosts

      - name: Ensure Beget Node
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_NODE_PATH: ${{ secrets.BEGET_NODE_PATH }}
        run: |
          NODE_PATH_REMOTE="$BEGET_NODE_PATH"
          if [ -z "$NODE_PATH_REMOTE" ]; then
            FIRST_CHAR="${BEGET_USER:0:1}"
            NODE_PATH_REMOTE="/home/$FIRST_CHAR/$BEGET_USER/.local/bin/node"
          fi

          ssh -i ~/.ssh/beget_deploy_key -p "$BEGET_PORT" "$BEGET_USER@$BEGET_HOST" "BEGET_NODE_PATH='$NODE_PATH_REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ -x "$BEGET_NODE_PATH" ]; then
            "$BEGET_NODE_PATH" -v
            exit 0
          fi

          NODE_VERSION="24.18.0"
          case "$(uname -m)" in
            x86_64) NODE_PLATFORM="linux-x64" ;;
            aarch64|arm64) NODE_PLATFORM="linux-arm64" ;;
            *) echo "Unsupported server architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          NODE_NAME="node-v${NODE_VERSION}-${NODE_PLATFORM}"
          NODE_DIR="$HOME/.local/${NODE_NAME}"
          NODE_ARCHIVE="/tmp/${NODE_NAME}.tar.gz"
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_NAME}.tar.gz"

          mkdir -p "$HOME/.local/bin"

          if [ ! -x "$NODE_DIR/bin/node" ]; then
            rm -rf "$NODE_DIR" "$NODE_ARCHIVE"
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL "$NODE_URL" -o "$NODE_ARCHIVE"
            else
              wget -q "$NODE_URL" -O "$NODE_ARCHIVE"
            fi
            tar -xzf "$NODE_ARCHIVE" -C "$HOME/.local"
            rm -f "$NODE_ARCHIVE"
          fi

          ln -sfn "$NODE_DIR/bin/node" "$HOME/.local/bin/node"
          ln -sfn "$NODE_DIR/bin/npm" "$HOME/.local/bin/npm"
          "$BEGET_NODE_PATH" -v
          REMOTE

      - name: Deploy static files
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
        run: |
          rsync -az --delete \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/beget_deploy_key -p $BEGET_PORT" \
            dist/ "$BEGET_USER@$BEGET_HOST:$BEGET_PATH/"

      - name: Restart Beget API
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
        run: |
          DATA_DIR="$(dirname "$BEGET_PATH")/rwscargo-crm-data"
          ssh -i ~/.ssh/beget_deploy_key -p "$BEGET_PORT" "$BEGET_USER@$BEGET_HOST" \
            "mkdir -p '$DATA_DIR' '$BEGET_PATH/api/tmp' && touch '$BEGET_PATH/api/tmp/restart.txt'"

      - name: Verify Beget API
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_PATH: ${{ secrets.BEGET_PATH }}
          BEGET_NODE_PATH: ${{ secrets.BEGET_NODE_PATH }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://rwscargo.ru/api/health; then
              exit 0
            fi
            sleep 5
          done

          NODE_PATH_REMOTE="$BEGET_NODE_PATH"
          if [ -z "$NODE_PATH_REMOTE" ]; then
            FIRST_CHAR="${BEGET_USER:0:1}"
            NODE_PATH_REMOTE="/home/$FIRST_CHAR/$BEGET_USER/.local/bin/node"
          fi

          ssh -i ~/.ssh/beget_deploy_key -p "$BEGET_PORT" "$BEGET_USER@$BEGET_HOST" "
            set -u
            echo '--- api dir ---'
            ls -la '$BEGET_PATH/api' || true
            echo '--- htaccess ---'
            sed -n '1,80p' '$BEGET_PATH/api/.htaccess' || true
            echo '--- node ---'
            '$NODE_PATH_REMOTE' -v || true
            echo '--- syntax ---'
            cd '$BEGET_PATH/api' && '$NODE_PATH_REMOTE' --check server.js || true
            echo '--- direct start ---'
            cd '$BEGET_PATH/api' && rm -f /tmp/rwscargo-api-check.log /tmp/rwscargo-api-check.pid
            cd '$BEGET_PATH/api' && (PORT=3999 '$NODE_PATH_REMOTE' server.js > /tmp/rwscargo-api-check.log 2>&1 & echo \$! > /tmp/rwscargo-api-check.pid)
            sleep 3
            curl -sS -i http://127.0.0.1:3999/health || true
            if [ -f /tmp/rwscargo-api-check.pid ]; then kill \$(cat /tmp/rwscargo-api-check.pid) 2>/dev/null || true; fi
            cat /tmp/rwscargo-api-check.log || true
          "

          exit 1
